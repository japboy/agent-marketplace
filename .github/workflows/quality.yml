name: Quality

on:
  push:

permissions:
  contents: read

jobs:
  structured-format-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: v2026.8.0
          sha256: dc62954db7ac2c5a37e3c0454d1744d2eb0bec373222cda6219c5ae3704a759c
          cache: true
      - run: mise run format-check

  prose-policy-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: v2026.8.0
          sha256: dc62954db7ac2c5a37e3c0454d1744d2eb0bec373222cda6219c5ae3704a759c
          cache: true
      - run: mise run prose-test
      - run: mise run prose-check

  agent-skills-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: v2026.8.0
          sha256: dc62954db7ac2c5a37e3c0454d1744d2eb0bec373222cda6219c5ae3704a759c
          cache: true
      - run: mise run skills-check
