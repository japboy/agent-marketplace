name: Quality

on:
  push:

permissions:
  contents: read

jobs:
  structured-format-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: v2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          cache: true
      - run: mise run format-check

  prose-policy-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: v2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          cache: true
      - run: mise run prose-test
      - run: mise run prose-check

  agent-skills-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: v2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          cache: true
      - run: mise run skills-check

  apm-distribution-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: v2026.10.13
          sha256: 94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12
          cache: true
      - run: mise run marketplace-check
      - run: mise run apm-test
